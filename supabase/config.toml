project_id = "bravo-gaming-esports-nextjs"

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = [
  "./migrations/001_initial_schema.sql",
  "./migrations/002_readiness_recovery.sql",
  "./migrations/003_storage_buckets_and_policies.sql",
  "./migrations/004_seed_defaults.sql",
  "./migrations/005_milestone4_live_schema_alignment.sql",
  "./migrations/006_milestone4_profiles_auth_upsert_compat.sql",
  "./migrations/007_milestone4_legacy_users_auth_compat.sql",
  "./migrations/008_launch_hotfix_blockers.sql",
  "./migrations/009_profiles_rls_policy_cleanup.sql",
  "./migrations/010_pubg_import_lifecycle_extensions.sql",
  "./migrations/011_profile_discord_links.sql",
  "./migrations/012_fix_security_invoker_leaderboard_views.sql",
  "./migrations/013_add_demo_seed_tag_columns.sql",
  "./migrations/014_shared_rate_limits.sql",
  "./migrations/015_production_security_reconciliation.sql",
  "./migrations/016_view_and_rate_limit_security.sql",
  "./migrations/017_complete_authentication_hardening.sql",
  "./migrations/018_discord_role_sync.sql",
  "./migrations/019_discord_team_role_mappings.sql",
    "./migrations/020_relational_team_registry_reconciliation.sql",
    "./migrations/021_relational_team_membership_authorization.sql",
    "./migrations/022_player_team_match_history_linking.sql",
    "./migrations/023_private_document_and_publication_boundary.sql",
  ]

[db.seed]
enabled = false

[auth]
site_url = "https://bravo-gaming-esports.vercel.app"
additional_redirect_urls = [
  "https://bravo-gaming-esports.vercel.app/auth/callback",
  "https://bravo-gaming-esports.vercel.app/reset-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/reset-password",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/reset-password",
]

[storage]
enabled = true
file_size_limit = "50MiB"

[vector]
enabled = false
